<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private local clips</title><link rel="stylesheet" href="local-playback-frame.css"></head>
<body><section id="picker"><label>Open an edit <select id="packet-kind"><option value="private">Local user packet</option><option value="catalog">Legacy signed folder (unencrypted)</option><option value="protected">Website edit (protected)</option></select></label><label id="folder-label">Choose packet folder <input id="folder" type="file" webkitdirectory multiple></label><button id="choose-directory" type="button">Open local edits folder</button><div id="protected-picker" hidden><label>Release ID <input id="protected-release" type="text" maxlength="36"></label><label class="check"><input id="protected-offline" type="checkbox">Reopen offline</label><label class="check"><input id="protected-combined" type="checkbox">Combined download</label><button id="protected-load" type="button" disabled>Load protected edit</button></div><details id="import-help"><summary>Advanced import options</summary><label class="check"><input id="show-legacy" type="checkbox">Show legacy signed-folder import</label><p>Protected website edits are signed and encrypted, with a renewable playback license. Legacy signed folders verify the publisher but contain unencrypted media. Local user packets are a separate, unsigned import.</p></details><output id="status" role="status">Files stay inside the extension.</output></section><main id="video-host"></main><script type="module" src="local-playback-frame.mjs"></script></body></html>
